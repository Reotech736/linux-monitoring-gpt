AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Linux Monitoring GPT PoC - read-only AMP diagnostic API

Metadata:
  ResourceTags:
    Project: linux-monitoring-gpt
    Environment: poc
    ManagedBy: cloudformation
    Component: diagnostic-api

Parameters:
  AmpWorkspaceArn:
    Type: String
    Description: AMP workspace ARN. The status Lambda can query only this workspace.
  AmpWorkspaceId:
    Type: String
    Description: AMP workspace ID used to construct the Prometheus-compatible query endpoint.
  ApiKeyParameterName:
    Type: String
    Description: Existing SSM SecureString parameter name containing the API shared secret.
    AllowedPattern: '^/[a-zA-Z0-9_./-]+$'
  AllowedHostId:
    Type: String
    Default: home-server
    Description: The sole host ID exposed by this PoC API.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito managed login domain.
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
  ChatGptOAuthCallbackUrl:
    Type: String
    Default: https://chatgpt.com/aip/g-6a53c4cf774481919948ee509a3e6cda/oauth/callback
    Description: OAuth callback URL shown by the current Custom GPT editor.
  ChatOpenAiOAuthCallbackUrl:
    Type: String
    Default: https://chat.openai.com/aip/g-6a53c4cf774481919948ee509a3e6cda/oauth/callback
    Description: Alternate OAuth callback URL documented for Custom GPT Actions.

Resources:
  DiagnosticApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: linux-monitoring-gpt
        - Key: Environment
          Value: poc
        - Key: ManagedBy
          Value: cloudformation
        - Key: Component
          Value: diagnostic-api

  StatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-status'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: linux-monitoring-gpt
        - Key: Environment
          Value: poc
        - Key: ManagedBy
          Value: cloudformation
        - Key: Component
          Value: diagnostic-api

  AuthorizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-authorizer'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: linux-monitoring-gpt
        - Key: Environment
          Value: poc
        - Key: ManagedBy
          Value: cloudformation
        - Key: Component
          Value: diagnostic-api

  DiagnosticHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      AccessLogSettings:
        DestinationArn: !GetAtt DiagnosticApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'
      Tags:
        Project: linux-monitoring-gpt
        Environment: poc
        ManagedBy: cloudformation
        Component: diagnostic-api
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          SharedSecretAuthorizer:
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Headers:
                - x-api-key
          CognitoJwtAuthorizer:
            AuthorizationScopes:
              - linux-monitoring/status.read
            JwtConfiguration:
              audience:
                - !Ref CognitoUserPoolClient
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
            IdentitySource: '$request.header.Authorization'

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        Project: linux-monitoring-gpt
        Environment: poc
        ManagedBy: cloudformation
        Component: diagnostic-api

  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Identifier: linux-monitoring
      Name: Linux Monitoring Diagnostic API
      Scopes:
        - ScopeName: status.read
          ScopeDescription: Read the current status of an authorized monitoring host.

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub '${AWS::StackName}-custom-gpt'
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - linux-monitoring/status.read
      CallbackURLs:
        - !Ref ChatGptOAuthCallbackUrl
        - !Ref ChatOpenAiOAuthCallbackUrl
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2
      UserPoolId: !Ref CognitoUserPool

  HomeServerViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: monitoring-viewer-home-server
      Description: Users allowed to view the home-server monitoring status.
      UserPoolId: !Ref CognitoUserPool

  StatusFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: linux-monitoring-gpt
        - Key: Environment
          Value: poc
        - Key: ManagedBy
          Value: cloudformation
        - Key: Component
          Value: diagnostic-api
      Policies:
        - PolicyName: query-project-amp-workspace
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: aps:QueryMetrics
                Resource: !Ref AmpWorkspaceArn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${StatusFunctionLogGroup.Arn}:*'

  AuthorizerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: linux-monitoring-gpt
        - Key: Environment
          Value: poc
        - Key: ManagedBy
          Value: cloudformation
        - Key: Component
          Value: diagnostic-api
      Policies:
        - PolicyName: read-api-shared-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterName}'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AuthorizerFunctionLogGroup.Arn}:*'

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-status'
      CodeUri: ../lambda/status_api/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Role: !GetAtt StatusFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Tags:
        Project: linux-monitoring-gpt
        Environment: poc
        ManagedBy: cloudformation
        Component: diagnostic-api
      Environment:
        Variables:
          ALLOWED_HOST_ID: !Ref AllowedHostId
          ALLOWED_COGNITO_GROUP: !Ref HomeServerViewerGroup
          AMP_QUERY_ENDPOINT: !Sub 'https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${AmpWorkspaceId}'
      Events:
        GetHostStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiagnosticHttpApi
            Path: /hosts/{host_id}/status
            Method: GET

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-authorizer'
      CodeUri: ../lambda/authorizer/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Role: !GetAtt AuthorizerFunctionRole.Arn
      Timeout: 15
      MemorySize: 128
      Tags:
        Project: linux-monitoring-gpt
        Environment: poc
        ManagedBy: cloudformation
        Component: diagnostic-api
      Environment:
        Variables:
          API_KEY_PARAMETER_NAME: !Ref ApiKeyParameterName

Outputs:
  ApiUrl:
    Description: Authenticated status API base URL.
    Value: !Sub 'https://${DiagnosticHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  StatusEndpoint:
    Description: Status API URL for the configured host.
    Value: !Sub 'https://${DiagnosticHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/hosts/${AllowedHostId}/status'
  ApiKeyParameterName:
    Description: SSM SecureString parameter name supplied at deployment.
    Value: !Ref ApiKeyParameterName
  CognitoUserPoolId:
    Description: Cognito User Pool for invited Custom GPT users.
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: OAuth client ID for the Custom GPT Action.
    Value: !Ref CognitoUserPoolClient
  CognitoIssuer:
    Description: JWT issuer configured on the HTTP API.
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
  CognitoAuthorizationUrl:
    Description: OAuth authorization URL for the Custom GPT Action.
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'
  CognitoTokenUrl:
    Description: OAuth token URL for the Custom GPT Action.
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
  CognitoScope:
    Description: OAuth scope required by the status route.
    Value: linux-monitoring/status.read
