services:
  init-prometheus-data:
    image: prom/prometheus:v3.13.0
    container_name: linux-monitoring-prometheus-data-init
    user: "0:0"
    entrypoint:
      - /bin/chown
      - -R
      - "${AGENT_UID:-65534}:${AGENT_GID:-65534}"
      - /prometheus
    volumes:
      - ./data:/prometheus
    restart: "no"

  prometheus-agent:
    image: prom/prometheus:v3.13.0
    container_name: linux-monitoring-prometheus-agent
    user: "${AGENT_UID:-65534}:${AGENT_GID:-65534}"
    network_mode: host
    command:
      - --agent
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.agent.path=/prometheus
      - --web.listen-address=127.0.0.1:19090
    depends_on:
      init-prometheus-data:
        condition: service_completed_successfully
    environment:
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ${AGENT_AWS_CREDENTIALS_FILE:-./credentials.empty}:/aws/credentials:ro
      - ${AGENT_AWS_CONFIG_FILE:-./config.empty}:/aws/config:ro
      - ./data:/prometheus
    restart: unless-stopped
